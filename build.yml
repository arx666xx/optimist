name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: >
          dotnet publish src/NetOptimizer/NetOptimizer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      # The in-app updater refuses to install a release that has no checksum,
      # so publish one alongside the .exe.
      - name: Compute SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/NetOptimizer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NetOptimizer.exe" | Out-File -FilePath publish/NetOptimizer.exe.sha256 -Encoding ascii -NoNewline
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetOptimizer-win-x64
          path: |
            publish/NetOptimizer.exe
            publish/NetOptimizer.exe.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/NetOptimizer.exe
            publish/NetOptimizer.exe.sha256
          generate_release_notes: true
